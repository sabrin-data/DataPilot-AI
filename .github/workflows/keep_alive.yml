name: Keep Streamlit Alive

on:
  schedule:
    # يعمل تلقائياً لإرسال زيارة للموقع تمنعه من النوم
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -L "https://datapilot-analytics.streamlit.app" > /dev/null
