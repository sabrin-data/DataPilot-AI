<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPilot AI — Enterprise Automated Analytics Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .logo-title {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="logo-title">🧠 DataPilot AI</h1>
        <p class="subtitle">Turn your raw data into insights in minutes. Clean, analyze, visualize, and generate report automatically.</p>
        <a href="https://datapilot-analytics.streamlit.app/" class="btn">Launch Application</a>
    </div>
</body>
</html>
